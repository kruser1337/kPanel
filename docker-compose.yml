# kPanel: a Minecraft server with a web admin panel.
#
#   docker compose up -d
#
# That is the whole setup. No .env needed: players join on port 25565, and the
# panel and file manager open on this machine only:
#
#   panel         http://localhost:8080
#   file manager  http://localhost:8080/files/  (served by the panel)
#
# Optional extras are overlays, added with -f (see README.md):
#   compose/lan.yml        reach the panel from other devices on your network
#   compose/tailscale.yml  reach it from anywhere over your tailnet, with HTTPS
#
# Gameplay settings (difficulty, MOTD, max players, ...) are not set here: the
# panel's Settings page writes them to server.properties. The image rewrites
# every key it has a variable for on each start, so a key set below would undo
# the panel's edits to it.

services:
  mc:
    # Paper 26.x needs Java 25; the java21 tag fails with UnsupportedClassVersionError.
    image: itzg/minecraft-server:stable-java25
    restart: unless-stopped
    # No setuid binary in the container can gain privileges (itzg drops from
    # root to uid 1000 without one, so this costs nothing).
    security_opt: ["no-new-privileges:true"]
    tty: true
    stdin_open: true
    # The game port, on every interface: this is what players connect to.
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TZ: "${TZ:-Etc/UTC}"

      # --- version pin -------------------------------------------------------
      # Pinned, never floating: a restart must not silently change the jar.
      # The newest version with a STABLE Paper build. A beta (experimental)
      # build is your call, not the default: see "Newer Minecraft versions" in
      # README.md. Never downgrade VERSION: a newer version migrates the world
      # on load, so there is no way back without a backup.
      TYPE: "PAPER"
      VERSION: "26.2"
      PAPER_BUILD: "129"

      # --- memory ------------------------------------------------------------
      # MEMORY must be blank or it overrides INIT_MEMORY/MAX_MEMORY.
      # 2G suits a few players; raise MAX_MEMORY if your host has room.
      MEMORY: ""
      INIT_MEMORY: "1G"
      MAX_MEMORY: "2G"
      USE_AIKAR_FLAGS: "true"

      # --- who can join ---------------------------------------------------------
      # ONLINE_MODE must stay TRUE: it checks joiners against Mojang's login.
      # The whitelist is on, so add yourself on the panel's Players page first.
      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      # Whitelist and ops live only in whitelist.json / ops.json, edited live
      # over RCON. No WHITELIST/OPS variables on purpose: the image rewrites the
      # files on every start when either is set, undoing removals.
      EXISTING_WHITELIST_FILE: "SKIP"
      EXISTING_OPS_FILE: "SKIP"

      # RCON is how the panel and the backups talk to the server. Deliberately
      # no RCON_PASSWORD here: when it is unset the image generates a random one
      # on every start and writes it to /data, where the panel and mc-backup read
      # it. (Set to an empty string, it would be an empty password.) The port is
      # never published; only containers in this stack can reach it.
      ENABLE_RCON: "true"
    volumes:
      - mc-data:/data

  mc-backup:
    # Pinned, like the server: a broken or compromised latest would otherwise
    # arrive with the next pull.
    image: itzg/mc-backup:2026.9.3
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      TZ: "${TZ:-Etc/UTC}"
      # Twice a day at fixed clock times, keeping the newest 4 (two days back).
      # A cron schedule rather than an interval: an interval restarts with the
      # container, so frequent restarts would mean no backups at all.
      CRON_SCHEDULE: "0 6,18 * * *"
      PRUNE_BACKUPS_COUNT: "4"
      PRUNE_BACKUPS_DAYS: "7"
      # Flushes and pauses world saves over RCON while archiving. The password
      # comes from /data/.rcon-cli.env, re-read before every backup.
      RCON_HOST: "mc"
      RCON_PORT: "25575"
    # Healthy = crond is running (backups only run for seconds at a time).
    healthcheck:
      test: ["CMD", "pgrep", "crond"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - mc-data:/data:ro
      - mc-backups:/backups

  # File manager over the world, configs, logs and plugins; backups read-only.
  filebrowser:
    # FileBrowser Quantum, the maintained fork of filebrowser/filebrowser.
    image: gtstef/filebrowser:1.5.6-stable-slim
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
    # Published nowhere, and no login of its own: the panel serves it under
    # /files/ (FILES_UPSTREAM below), behind the panel's host check and login.
    # On a port of its own, a web page using DNS rebinding could write to /data,
    # a plugin .jar included, and so run code in the server.
    # The config is written on every start, so it lives here. It holds no
    # variables, and the quoted 'EOF' keeps the shell from expanding any. defaultEnabled
    # must be explicit on every source: with more than one, Quantum otherwise
    # defaults to false and users get "no access to source".
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /tmp/config.yaml <<'EOF'
        server:
          port: 80
          baseURL: /files/
          disableUpdateCheck: true
          disablePreviews: true
          disableWebDAV: true
          sources:
            - path: /data
              name: minecraft
              config:
                defaultEnabled: true
            - path: /backups
              name: backups
              config:
                defaultEnabled: true
                readOnly: true
        auth:
          methods:
            noauth: true
        EOF
        # kPanel 0.2 with compose/lan.yml gave the file manager a password,
        # and FileBrowser kept it in plain text in its database's settings,
        # which the noauth config above never rewrites. Without a login nothing
        # in the database is needed, so one holding a password is dropped
        # (FileBrowser recreates it). A fresh one stores "adminPassword":"".
        db=/home/filebrowser/data/database.db
        if [ -f "$$db" ] && grep -q -e '"adminPassword":"[^"]' -e '"noauth":false' "$$db"; then
          rm -f "$$db" && echo "kPanel: removed the file manager's old database: it held a password"
        fi
        # The server's umask: files it writes stay group-writable, so the panel
        # (group 1000) can still save a server.properties uploaded here.
        umask 002
        exec ./filebrowser -c /tmp/config.yaml
    # uid 1000, like the server, so files it writes stay readable. Don't edit
    # world/ files while players are online.
    volumes:
      - mc-data:/data
      - mc-backups:/backups:ro
      - filebrowser-db:/home/filebrowser/data

  # The panel: dashboard, settings, players, gamerules, logs.
  kpanel:
    build:
      context: ./kpanel
    restart: unless-stopped
    # The panel needs no Linux capability and writes only to its volumes, so
    # it runs with none and a read-only root filesystem: code that gets in
    # can't change the panel's own files or gain privileges.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    # Shares mc's process namespace to read the JVM's CPU and memory from /proc.
    # Deliberately not the Docker socket, which would expose every container's
    # environment on the host. The image runs as uid 1001 (group 1000), not the
    # server's 1000: the kernel lets no server process, plugins included, read
    # the environment or memory of any process here, the healthcheck and
    # `docker compose exec` included.
    pid: "service:mc"
    # Loopback only. That, with the panel's Host check against DNS rebinding
    # (KPANEL_ALLOWED_HOSTS below), is what makes running without a login safe.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # The panel can op, ban and read the world, so it refuses to start until
      # it is told how it is protected. Here: only this machine can reach it.
      # compose/lan.yml clears this and requires KPANEL_BASIC_AUTH instead.
      KPANEL_ALLOW_NO_AUTH: "1"
      # The login, when there is one: an argon2id hash, never the password.
      # Make it with `docker compose run --rm --build hashpw` (service below).
      KPANEL_USER: "${KPANEL_USER:-admin}"
      KPANEL_PASSWORD_HASH: "${KPANEL_PASSWORD_HASH:-}"
      # Deprecated: the password in plain text, user:password. Still works, with
      # a warning on every page; kPanel 0.4 refuses it.
      KPANEL_BASIC_AUTH: "${KPANEL_BASIC_AUTH:-}"
      # Without a login the panel answers only to localhost, so a web page can't
      # point its own domain at this machine and drive the panel (DNS
      # rebinding). Names you open it by on purpose go here, comma-separated.
      KPANEL_ALLOWED_HOSTS: "${KPANEL_ALLOWED_HOSTS:-}"
      # The footer asks api.github.com twice a day for a newer kPanel release.
      # Set KPANEL_UPDATE_CHECK=0 to never contact GitHub for it.
      KPANEL_UPDATE_CHECK: "${KPANEL_UPDATE_CHECK:-1}"
      # Optional: with both set, Settings opens pull requests against your fork
      # instead of writing server.properties (see .env.example).
      GITHUB_TOKEN: "${KPANEL_GITHUB_TOKEN:-}"
      GITHUB_REPO: "${KPANEL_GITHUB_REPO:-}"
      GITHUB_BRANCH: "main"
      COMPOSE_PATH: "docker-compose.yml"
      # The file manager, served by the panel at /files/ (the Files link).
      FILES_UPSTREAM: "http://filebrowser:80"
      RCON_HOST: "mc"
      RCON_PORT: "25575"
      # What players type to connect; the dashboard shows and pings it.
      PUBLIC_HOST: "${MC_PUBLIC_HOST:-localhost}"
      GAME_HOST: "mc"
    # Read-write, and not for one file only: Settings writes server.properties
    # in place (everything else goes through RCON), but the server creates its
    # files group-writable, so group 1000 can write nearly all of /data,
    # plugins/ included. Code that takes over the panel can run code in the
    # server. Keep the panel behind its login or on loopback.
    volumes:
      - mc-data:/data
      - mc-backups:/backups:ro
      # The panel's only state: dashboard history. (kpanel-data up to 0.2,
      # owned by the old uid 1000; a fresh volume gets the image's ownership.)
      - kpanel-state:/var/lib/kpanel

  # Makes the panel's login hash. Not started by `up`; run it when you need it:
  #
  #   docker compose run --rm --build hashpw
  #
  # It asks for the password and prints the KPANEL_PASSWORD_HASH line for .env.
  # A container of its own: no network, no volumes, no environment, and not in
  # the server's process namespace, so nothing in the server can watch the
  # password being typed.
  hashpw:
    build:
      context: ./kpanel
    profiles: [tools]
    command: ["python", "hashpw.py"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  mc-data:
  mc-backups:
  filebrowser-db:
  kpanel-state:
