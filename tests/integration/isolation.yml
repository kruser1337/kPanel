# Test-only overlay for plugin_isolation.sh: nothing published (no clash with
# a running kPanel), no update check (no network from the panel). The markers
# come in through --env-file.
services:
  mc:
    ports: !reset []
  kpanel:
    ports: !reset []
    environment:
      KPANEL_UPDATE_CHECK: "0"
  filebrowser:
    # Docker Engine sets this in every container; Podman does not, and
    # FileBrowser (uid 1000) binds :80.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
