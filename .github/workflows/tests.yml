name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The image's pinned dependencies, so tests run against what ships.
      - run: pip install -r kpanel/requirements.txt
      # No PROPS_FIXTURE: the suite falls back to kpanel/testdata/server.properties,
      # so this is the same run a contributor gets on a fresh clone.
      - name: Run tests
        working-directory: kpanel
        run: python -m unittest discover -v
