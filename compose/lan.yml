# Reach the panel and file manager from other devices on your network:
#
#   docker compose -f docker-compose.yml -f compose/lan.yml up -d
#
# Publishes the panel on every interface of this host, so it needs a login,
# and refuses to start until it has one (in .env, next to docker-compose.yml):
#
#   KPANEL_PASSWORD_HASH='$argon2id$...'   from: docker compose run --rm --build hashpw
#
# Then open http://<this-host>:8080. The file manager comes along at /files/,
# behind the same login. This is plain HTTP: fine on a home network, not
# across the internet. For that, use compose/tailscale.yml.
#
# Needs Docker Compose 2.24 or newer (for !override).

services:
  kpanel:
    # !override replaces the base's loopback binding instead of adding to it.
    ports: !override
      - "0.0.0.0:8080:8080"
    environment:
      # Reachable from the network now, so "no login" is no longer an option:
      # with this cleared, the panel refuses to start without KPANEL_PASSWORD_HASH
      # in .env.
      KPANEL_ALLOW_NO_AUTH: ""
